<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Payment Not Completed | VALAR</title>

  <style>
    * {
      box-sizing: border-box;
    }

    :root {
      --black: #090909;
      --dark: #111111;
      --gold: #d5b15a;
      --white: #ffffff;
      --muted: #a8a8a8;
      --red: #e06b6b;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      font-family: Arial, sans-serif;
      background: var(--black);
      color: var(--white);
    }

    .card {
      width: 100%;
      max-width: 520px;
      padding: 42px 28px;
      text-align: center;
      background: var(--dark);
      border: 1px solid #292929;
      border-radius: 18px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.35);
    }

    .icon {
      width: 72px;
      height: 72px;
      margin: 0 auto 22px;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 2px solid var(--red);
      border-radius: 50%;
      color: var(--red);
      font-size: 32px;
      font-weight: bold;
    }

    h1 {
      margin: 0 0 12px;
      font-size: 28px;
      letter-spacing: 1px;
    }

    p {
      margin: 10px 0;
      line-height: 1.6;
      color: var(--muted);
    }

    .button {
      display: inline-block;
      margin-top: 20px;
      padding: 13px 24px;
      border-radius: 8px;
      background: var(--gold);
      color: #111;
      text-decoration: none;
      font-weight: bold;
    }
  </style>
</head>

<body>

  <main class="card">

    <div class="icon">!</div>

    <h1>PAYMENT NOT COMPLETED</h1>

    <p>
      The payment was not completed.
    </p>

    <p>
      You can return to VALAR and try again,
      or choose another payment method.
    </p>

    <a
      class="button"
      href="https://valarbravewear.github.io/valar/"
    >
      RETURN TO VALAR
    </a>

  </main>

</body>
</html>
