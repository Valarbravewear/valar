<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>VALAR Admin Login</title>

  <link
    rel="stylesheet"
    href="admin.css"
  >

  <!-- Supabase -->
  <script
    src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"
  ></script>

  <!-- VALAR Supabase configuration -->
  <script src="config.js"></script>

</head>

<body class="login-page">

  <main class="login-card">

    <!-- VALAR ADMIN LOGO -->
    <img
      src="valar-logo-dark.jpg"
      alt="VALAR"
      class="login-logo"
    >

    <p class="eyebrow">
      ADMIN LOGIN
    </p>

    <h1>
      VALAR ADMINISTRATION
    </h1>

    <form id="loginForm">

  <label>
    Email

    <input
      type="email"
      name="email"
      placeholder="Admin email"
      autocomplete="username"
      required
    >
  </label>


  <label>
    Password

    <div class="password-field">

      <input
        type="password"
        name="password"
        id="password"
        placeholder="Password"
        autocomplete="current-password"
        required
      >

      <button
        type="button"
        class="password-toggle"
        id="passwordToggle"
        aria-label="Show password"
      >
        <span class="eye-icon">👁</span>
      </button>

    </div>

  </label>


  <button
    type="submit"
    id="loginButton"
  >
    LOGIN
  </button>


  <p
    id="loginMsg"
    aria-live="polite"
  ></p>

</form>

  </main>

  <!-- Login logic -->
  <script src="admin-login.js"></script>

</body>

</html>
